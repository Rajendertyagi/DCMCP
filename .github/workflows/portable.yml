name: Build Desktop Commander - Windows EXE

on:
  workflow_dispatch:
  push:
    branches:
      - main
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "canary"

      - name: Install dependencies
        shell: pwsh
        run: bun install --ignore-scripts

      - name: Build TypeScript
        shell: pwsh
        run: bun run build

      - name: Clean dist
        shell: pwsh
        run: Remove-Item -Recurse -Force dist -ErrorAction SilentlyContinue

      - name: Create dist directory
        shell: pwsh
        run: New-Item -ItemType Directory -Path dist -Force

      - name: Patch createRequire to static imports
        # Fixes Bun bundler bug with createRequire (PR #36565 pending merge)
        shell: pwsh
        run: |
          $src = Get-Content ./src/tools/pdf/lib/pdf2md.ts -Raw
          $patched = $src `
            -replace "import \{ createRequire \} from 'module';", "" `
            -replace "const require = createRequire\(import\.meta\.url\);", "" `
            -replace "const \{ parse \} = require\('@opendocsg/pdf2md/lib/util/pdf'\);", "import { parse } from '@opendocsg/pdf2md/lib/util/pdf';" `
            -replace "const \{ makeTransformations, transform \} = require\('@opendocsg/pdf2md/lib/util/transformations'\);", "import { makeTransformations, transform } from '@opendocsg/pdf2md/lib/util/transformations';"
          Set-Content -Path ./src/tools/pdf/lib/pdf2md.ts -Value $patched -NoNewline

      - name: Build standalone EXE
        shell: pwsh
        run: bun build ./src/index.ts --compile --target=bun-windows-x64 --outfile ./dist/desktop-commander.exe

      - name: Restore original file
        shell: pwsh
        run: git checkout -- src/tools/pdf/lib/pdf2md.ts

      - name: Verify outputs
        shell: pwsh
        run: |
          $e = Get-Item ./dist/desktop-commander.exe
          Write-Host "EXE: $($e.FullName) ($($e.Length) bytes)"

      - name: Upload Windows EXE
        uses: actions/upload-artifact@v7
        with:
          name: desktop-commander-windows-x64
          path: dist/desktop-commander.exe

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v3
        with:
          files: dist/desktop-commander.exe
          generate_release_notes: true
