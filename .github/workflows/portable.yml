name: Build Desktop Commander - Windows Portable

on:
  workflow_dispatch:
  push:
    branches:
      - main
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.2"

      - name: Install dependencies
        shell: pwsh
        run: bun install --ignore-scripts

      - name: Prepare directories
        shell: pwsh
        run: |
          Remove-Item ./dist -Recurse -Force -ErrorAction SilentlyContinue
          Remove-Item ./release -Recurse -Force -ErrorAction SilentlyContinue

          New-Item -ItemType Directory ./dist -Force | Out-Null
          New-Item -ItemType Directory ./release -Force | Out-Null

      - name: Patch Bun-compatible imports
        shell: pwsh
        run: |
          $f1 = Get-Content "./src/tools/pdf/lib/pdf2md.ts" -Raw
          $f1 = $f1 -replace "import \{ createRequire \} from 'module';", ""
          $f1 = $f1 -replace "const require = createRequire\(import\.meta\.url\);", ""
          $f1 = $f1 -replace "const \{ parse \} = require\('@opendocsg/pdf2md/lib/util/pdf'\);", "import { parse } from '@opendocsg/pdf2md/lib/util/pdf';"
          $f1 = $f1 -replace "const \{ makeTransformations, transform \} = require\('@opendocsg/pdf2md/lib/util/transformations'\);", "import { makeTransformations, transform } from '@opendocsg/pdf2md/lib/util/transformations';"
          Set-Content "./src/tools/pdf/lib/pdf2md.ts" $f1 -NoNewline

          $f2 = Get-Content "./src/tools/pdf/manipulations.ts" -Raw
          $f2 = $f2 -replace "import \{ createRequire \} from 'module';", ""
          $f2 = $f2 -replace "const require = createRequire\(import\.meta\.url\);", ""
          $f2 = $f2 -replace "const \{ PDFDocument \} = require\('pdf-lib'\) as \{ PDFDocument: typeof PDFDocumentType \};", "import { PDFDocument } from 'pdf-lib';"
          Set-Content "./src/tools/pdf/manipulations.ts" $f2 -NoNewline

      - name: Build JavaScript dist
        shell: pwsh
        run: |
          bun build ./src/index.ts `
            --outdir ./dist `
            --target bun

      - name: Build standalone EXE
        shell: pwsh
        run: |
          bun build ./src/index.ts `
            --compile `
            --target=bun-windows-x64 `
            --outfile ./release/desktop-commander.exe

      - name: Restore source
        if: always()
        shell: pwsh
        run: |
          git checkout -- `
            src/tools/pdf/lib/pdf2md.ts `
            src/tools/pdf/manipulations.ts

      - name: Add package metadata
        shell: pwsh
        run: |
          Copy-Item ./package.json ./dist/package.json

      - name: Create dist ZIP
        shell: pwsh
        run: |
          Compress-Archive `
            -Path ./dist/* `
            -DestinationPath ./release/desktop-commander-dist.zip `
            -Force

      - name: Create portable package
        shell: pwsh
        run: |
          New-Item -ItemType Directory `
            ./release/desktop-commander-portable `
            -Force | Out-Null

          Copy-Item `
            ./release/desktop-commander.exe `
            ./release/desktop-commander-portable/desktop-commander.exe

          Copy-Item `
            ./dist `
            ./release/desktop-commander-portable/dist `
            -Recurse

      - name: Create portable ZIP
        shell: pwsh
        run: |
          Compress-Archive `
            -Path ./release/desktop-commander-portable `
            -DestinationPath ./release/desktop-commander-portable.zip `
            -Force

      - name: Verify outputs
        shell: pwsh
        run: |
          Write-Host "=== EXE ==="
          Get-Item ./release/desktop-commander.exe |
            Select-Object Name, Length

          Write-Host "=== DIST ZIP ==="
          Get-Item ./release/desktop-commander-dist.zip |
            Select-Object Name, Length

          Write-Host "=== PORTABLE ZIP ==="
          Get-Item ./release/desktop-commander-portable.zip |
            Select-Object Name, Length

      - name: Upload EXE
        uses: actions/upload-artifact@v4
        with:
          name: desktop-commander-windows-x64-exe
          path: release/desktop-commander.exe
          if-no-files-found: error

      - name: Upload dist ZIP
        uses: actions/upload-artifact@v4
        with:
          name: desktop-commander-windows-x64-dist
          path: release/desktop-commander-dist.zip
          if-no-files-found: error

      - name: Upload portable ZIP
        uses: actions/upload-artifact@v4
        with:
          name: desktop-commander-windows-x64-portable
          path: release/desktop-commander-portable.zip
          if-no-files-found: error

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v3
        with:
          files: |
            release/desktop-commander.exe
            release/desktop-commander-dist.zip
            release/desktop-commander-portable.zip
          generate_release_notes: true
