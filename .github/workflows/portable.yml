name: Build Desktop Commander - Windows EXE

on:
  workflow_dispatch:
  push:
    branches:
      - main
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "canary"

      - name: Install dependencies
        shell: pwsh
        run: bun install --ignore-scripts

      - name: Build TypeScript
        shell: pwsh
        run: bun run build

      - name: Clean dist
        shell: pwsh
        run: Remove-Item -Recurse -Force dist -ErrorAction SilentlyContinue

      - name: Create dist directory
        shell: pwsh
        run: New-Item -ItemType Directory -Path dist -Force

      - name: Build bundled JS to dist
        shell: pwsh
        run: bun build ./src/index.ts --target=node --outfile ./dist/desktop-commander.js

      - name: Build standalone EXE
        shell: pwsh
        run: bun build ./src/index.ts --compile --target=bun-windows-x64 --outfile ./dist/desktop-commander.exe
        continue-on-error: true

      - name: Verify outputs
        shell: pwsh
        run: |
          $e = Get-Item ./dist/desktop-commander.exe -ErrorAction SilentlyContinue
          $j = Get-Item ./dist/desktop-commander.js
          Write-Host "JS:  $($j.FullName) ($($j.Length) bytes)"
          if ($e) { Write-Host "EXE: $($e.FullName) ($($e.Length) bytes)" }
          else { Write-Host "EXE: build skipped — see logs" }

      - name: Upload artifacts
        uses: actions/upload-artifact@v7
        with:
          name: desktop-commander-windows-x64
          path: |
            dist/desktop-commander.js
            dist/desktop-commander.exe

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v3
        with:
          files: dist/desktop-commander.exe
          generate_release_notes: true
