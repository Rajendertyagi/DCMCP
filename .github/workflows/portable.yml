name: Build Desktop Commander - Windows EXE

on:
  workflow_dispatch:
  push:
    branches:
      - main
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '26'

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "canary"

      - name: Install dependencies
        shell: pwsh
        run: bun install --ignore-scripts

      - name: Build TypeScript
        shell: pwsh
        run: bun run build

      - name: Clean dist
        shell: pwsh
        run: Remove-Item -Recurse -Force dist -ErrorAction SilentlyContinue

      - name: Create dist directory
        shell: pwsh
        run: New-Item -ItemType Directory -Path dist -Force | Out-Null

      - name: Build bundled JS to dist
        shell: pwsh
        run: bun build ./src/index.ts --target=bun-windows-x64 --outfile ./dist/desktop-commander.js

      - name: Build standalone EXE
        shell: pwsh
        run: bun build ./src/index.ts --compile --target=bun-windows-x64 --outfile ./dist/desktop-commander.exe

      - name: Verify outputs
        shell: pwsh
        run: |
          if (!(Test-Path "./dist/desktop-commander.exe")) { Write-Error "EXE not created"; exit 1 }
          if (!(Test-Path "./dist/desktop-commander.js"))  { Write-Error "JS not created"; exit 1 }
          $e = Get-Item "./dist/desktop-commander.exe"
          Write-Host "EXE: $($e.FullName) ($($e.Length) bytes)"
          Write-Host "JS:  ./dist/desktop-commander.js"

      - name: Upload Windows EXE
        uses: actions/upload-artifact@v7
        with:
          name: desktop-commander-windows-x64
          path: dist/desktop-commander.exe
          if-no-files-found: error

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v3
        with:
          files: dist/desktop-commander.exe
          generate_release_notes: true
