name: Build Desktop Commander - Windows EXE

on:
  workflow_dispatch:
  push:
    branches:
      - main
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '26'

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "canary"

      - name: Install dependencies
        shell: pwsh
        run: bun install --ignore-scripts

      - name: Build TypeScript
        shell: pwsh
        run: bun run build

      - name: Build dist (bundled JS, no --compile)
        shell: pwsh
        run: |
          Remove-Item -Recurse -Force dist -ErrorAction SilentlyContinue
          New-Item -ItemType Directory -Path dist -Force | Out-Null
          bun build ./src/index.ts `
            --target=bun-windows-x64 `
            --outfile ./dist/desktop-commander.js

      - name: Build standalone EXE
        shell: pwsh
        run: |
          bun build ./src/index.ts `
            --compile `
            --target=bun-windows-x64 `
            --outfile ./dist/desktop-commander.exe

      - name: Verify outputs exist
        shell: pwsh
        run: |
          $exe = "./dist/desktop-commander.exe"
          $js  = "./dist/desktop-commander.js"
          if (!(Test-Path $exe)) {
            Write-Error "Standalone EXE was not created."
            exit 1
          }
          if (!(Test-Path $js)) {
            Write-Error "Bundled JS was not created."
            exit 1
          }
          $file = Get-Item $exe
          Write-Host "Build successful:"
          Write-Host "EXE: $($file.FullName) ($($file.Length) bytes)"
          Write-Host "JS:  $js"

      - name: Upload Windows EXE
        uses: actions/upload-artifact@v7
        with:
          name: desktop-commander-windows-x64
          path: dist/desktop-commander.exe
          if-no-files-found: error

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v3
        with:
          files: dist/desktop-commander.exe
          generate_release_notes: true
